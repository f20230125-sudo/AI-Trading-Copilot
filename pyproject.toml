[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trading-copilot"
version = "0.1.0"
description = "LLM agent + ML signal model + RAG over trading concepts, with an offline-safe fallback path."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "yfinance>=0.2",
    "anthropic>=0.34",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "httpx>=0.27"]

[project.scripts]
ai-trading-copilot = "ai_trading_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 115
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
